description: Base WiFi class with backed configuration for openHASP
version: "0.1.0"
dependencies:
  idf:
    version: ">=5.0"
  espressif/esp_hosted:
    rules:
    - if: target in [esp32p4, esp32h2]
    version: ^3.0.9
  espressif/esp_wifi_remote:
    rules:
    - if: target in [esp32p4, esp32h2]
    version: ^1.6.5