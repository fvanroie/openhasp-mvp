peripherals:
  - name: i2c_master
    type: i2c
    role: master
    config:
      port: 1
      pins:
        sda: 6
        scl: 5
      enable_internal_pullup: true

  - name: spi_sd
    type: spi
    role: master
    config:
      spi_bus_config:
        spi_port: 1
        mosi_io_num: 40
        miso_io_num: 38
        sclk_io_num: 39
        max_transfer_sz: 4000

  - name: ledc_backlight
    type: ledc
    version: default
    config:
      gpio_num: 45
      channel: LEDC_CHANNEL_0
      timer_sel: LEDC_TIMER_0
      freq_hz: 25000
      duty: 0
      duty_resolution: LEDC_TIMER_10_BIT
      output_invert: false
      speed_mode: LEDC_LOW_SPEED_MODE