devices:
  - name: display_lcd
    type: display_lcd
    sub_type: i80
    chip: st7796

    dependencies:
      espressif/esp_lcd_st7796: "^1.4.0"
      espressif/esp_board_manager: "*"

    config:
      # Native panel resolution
      x_max: 320
      y_max: 480

      # Board/panel behavior
      swap_xy: false
      mirror_x: true
      mirror_y: false
      invert_color: true
      need_reset: true

      # ESP32-S3 LCD I80 bus
      bus_config:
        dc_gpio_num: 0
        wr_gpio_num: 47
        data_gpio_nums:
          - 9
          - 46
          - 3
          - 8
          - 18
          - 17
          - 16
          - 15
        bus_width: 8
        max_transfer_bytes: 65536
        dma_burst_size: 64

      io_config:
        cs_gpio_num: -1
        pclk_hz: 20000000
        trans_queue_depth: 10
        lcd_cmd_bits: 8
        lcd_param_bits: 8

        dc_levels:
          dc_idle_level: 1
          dc_cmd_level: 0
          dc_dummy_level: 0
          dc_data_level: 1

        flags:
          cs_active_high: false
          reverse_color_bits: false
          swap_color_bytes: false
          pclk_active_neg: false
          pclk_idle_low: false

      # ST7796 panel
      panel_config:
        reset_gpio_num: 4
        rgb_ele_order: LCD_RGB_ELEMENT_ORDER_BGR
        data_endian: LCD_RGB_DATA_ENDIAN_LITTLE
        bits_per_pixel: 16

        flags:
          reset_active_high: false

        vendor_config: null

  - name: touch
    type: lcd_touch
    sub_type: i2c
    chip: ft5x06

    dependencies:
      espressif/esp_lcd_touch_ft5x06: "*"
      espressif/esp_lcd_touch: "*"
      espressif/esp_board_manager: "*"

    config:
      io_i2c_config:
        lcd_cmd_bits: 8

      touch_config:
        x_max: 480
        y_max: 320
        rst_gpio_num: -1
        int_gpio_num: -1  # 7

        levels:
          reset: 0
          interrupt: 0

        flags:
          swap_xy: false
          mirror_x: false
          mirror_y: false

    peripherals:
      - name: i2c_master
        i2c_addr:
          - 0x70

  - name: lcd_brightness
    type: ledc_ctrl
    version: default
    config:
      default_percent: 75
    peripherals:
      - name: ledc_backlight

  - name: sdcard
    type: fs_fat
    sub_type: spi

    config:
      mount_point: "/sdcard"

      vfs_config:
        format_if_mount_failed: false

      sub_config:
        cs_gpio_num: 41

    peripherals:
      - name: spi_sd

# Custom LVGL policy parameters for this board
  - name: lvgl
    type: custom
    init_skip: true
    config:
      displays:
        - lcd: display_lcd
          touch: touch
          backlight: lcd_brightness
          rotation: 0
          double_buffer: true
          use_psram: false
          buffer_height: 40

    depends_on:                  # Optional; initialization dependencies (list of device names)
      - display_lcd
      - touch
      - lcd_brightness