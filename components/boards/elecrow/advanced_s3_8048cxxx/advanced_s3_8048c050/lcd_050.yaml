devices:
  - name: display_lcd
    config:
      rgb_panel_config:
        timings:
          pclk_hz: 16000000          # TFT_PREFER_SPEED
          h_res: 800
          v_res: 480
          hsync_pulse_width: 4
          hsync_back_porch: 43
          hsync_front_porch: 8
          vsync_pulse_width: 4
          vsync_back_porch: 12
          vsync_front_porch: 8
          flags:
            hsync_idle_low: false    # TFT_HSYNC_POLARITY=0
            vsync_idle_low: false    # TFT_VSYNC_POLARITY=0
            de_idle_high: false
            pclk_active_neg: true    # TFT_PCLK_ACTIVE_NEG
            pclk_idle_high: false