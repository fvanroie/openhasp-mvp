devices:
  - name: lcd_touch
    type: lcd_touch
    sub_type: spi
    chip: xpt2046
    version: default
    dependencies:
      espressif/esp_lcd_touch_xpt2046: "*"
    config:
      io_spi_config:
        cs_gpio_num: 38
        pclk_hz: 2500000
        spi_mode: 0
        trans_queue_depth: 1
      touch_config:
        x_max: 800
        y_max: 480
        rst_gpio_num: -1
        int_gpio_num: 3
        levels:
          reset: 0
          interrupt: 0
        flags:
          swap_xy: false
          mirror_x: false
          mirror_y: false
    peripherals:
      - spi_name: spi_master