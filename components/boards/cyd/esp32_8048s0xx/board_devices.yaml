devices:
  - name: display_lcd
    type: display_lcd
    version: default
    sub_type: rgb
    chip: generic_rgb
    config:
      swap_xy: false
      mirror_x: false
      mirror_y: false
      invert_color: false
      need_reset: true
      bits_per_pixel: 16
      rgb_ele_order: LCD_RGB_ELEMENT_ORDER_RGB
      data_endian: LCD_RGB_DATA_ENDIAN_BIG
      rgb_panel_config:
        clk_src: LCD_CLK_SRC_PLL160M
        in_color_format: LCD_COLOR_FMT_RGB565
        out_color_format: LCD_COLOR_FMT_RGB565
        data_width: 16
        data_gpio_nums:
          - 6    # D0  = B0
          - 7    # D1  = B1
          - 15   # D2  = B2
          - 16   # D3  = B3
          - 8    # D4  = B4
          - 0    # D5  = G0
          - 9    # D6  = G1
          - 14   # D7  = G2
          - 47   # D8  = G3
          - 48   # D9  = G4
          - 3    # D10 = G5
          - 39   # D11 = R0
          - 40   # D12 = R1
          - 41   # D13 = R2
          - 42   # D14 = R3
          - 2    # D15 = R4
        hsync_gpio_num: 39
        vsync_gpio_num: 41
        de_gpio_num: 40
        pclk_gpio_num: 42
        disp_gpio_num: -1
        timings:
          h_res: 800
          v_res: 480
          flags:
            pclk_active_neg: true    # Phase matches perfectly with the GT911 touch engine
        num_fbs: 3
        flags:
          fb_in_psram: true
        dma_burst_size: 64
  - name: lcd_brightness
    type: ledc_ctrl
    version: default
    config:
      default_percent: 75
    peripherals:
      - name: ledc_backlight
  - name: sdcard
    type: fs_fat
    sub_type: spi
    version: default
    config:
      mount_point: "/sdcard"
      vfs_config:
        format_if_mount_failed: false
        max_files: 5
        allocation_unit_size: 16384
      sub_config:
        cs_gpio_num: 10
    peripherals:
      - name: spi_master
  - name: lvgl
    type: custom
    init_skip: true
    config:
      displays:
        - lcd: display_lcd
          touch: none
          backlight: lcd_brightness
          rotation: 0
          double_buffer: true
          use_psram: true
          buffer_height: 40
    depends_on:
      - display_lcd
      - lcd_brightness
