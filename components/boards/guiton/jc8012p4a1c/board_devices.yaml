- name: display_lcd
  type: display_lcd
  version: 1.0.0
  sub_type: dsi
  chip: jd9365

  dependencies:
    espressif/esp_lcd_jd9365: "*"

  config:
    invert_color: false

    need_reset: true
    reset_gpio_num: 27

    rgb_ele_order: LCD_RGB_ELEMENT_ORDER_RGB
    data_endian: LCD_RGB_DATA_ENDIAN_BIG

    # Application / DPI format.
    bits_per_pixel: 16
    frame_format: RGB565_LE

    reset_active_high: false

    # DBI command path.
    dbi_config:
      virtual_channel: 0
      lcd_cmd_bits: 8
      lcd_param_bits: 8

    # DPI pixel path.
    dpi_config:
      virtual_channel: 0
      dpi_clk_src: MIPI_DSI_DPI_CLK_SRC_DEFAULT
      dpi_clock_freq_mhz: 80

      pixel_format: LCD_COLOR_PIXEL_FORMAT_RGB565
      in_color_format: LCD_COLOR_FMT_RGB565
      out_color_format: LCD_COLOR_FMT_RGB565

      # Start with one framebuffer.
      # Once the panel is stable we can tune this for LVGL/PSRAM.
      num_fbs: 1

      flags:
        use_dma2d: true
        disable_lp: false

      video_timing:
        h_size: 800
        v_size: 1280

        hsync_back_porch: 20
        hsync_pulse_width: 20
        hsync_front_porch: 40

        vsync_back_porch: 10
        vsync_pulse_width: 4
        vsync_front_porch: 30

  peripherals:
    - ldo_name: ldo_mipi
    - dsi_name: dsi_display


- name: lcd_brightness
  type: ledc_ctrl
  version: default

  config:
    default_percent: 100

  peripherals:
    - ledc_name: ledc_backlight
