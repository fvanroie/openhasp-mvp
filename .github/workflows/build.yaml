name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        preset:
          - wt32-sc01-plus-8mb
          - wt32-sc01-plus-16mb

    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash

    container:
      image: espressif/idf:v6.0.2

    steps:
      - uses: actions/checkout@v5
      
      - name: Show ccache configuration
        run: |
          echo "CCACHE_DIR=$CCACHE_DIR"
          ccache --show-config
          ccache --show-stats

      - name: Inspect Python environment
        run: |
          echo "PATH=$PATH"
          echo "IDF_PATH=$IDF_PATH"
          which python
          python --version
          which pip || true
          find /opt/esp -maxdepth 4 -type f -name pip 2>/dev/null | head -20
          find /opt/esp -maxdepth 4 -type f -name python 2>/dev/null | head -20

      - name: Restore ccache
        uses: actions/cache@v5
        with:
          path: /github/home/.cache/ccache
          key: ccache-${{ runner.os }}-${{ hashFiles('CMakePresets.json', '**/CMakeLists.txt', 'esp/sdkconfig.defaults') }}
          restore-keys: |
            ccache-${{ runner.os }}-

      - name: Install project requirements
        run: |
          source "$IDF_PATH/export.sh"
          python -m pip install -r requirements.txt
      
      - name: Board Manager
        run: |
          source "$IDF_PATH/export.sh"
          idf.py bmgr -b "wt32_sc01_plus"
      
      - name: Build
        run: |
          source "$IDF_PATH/export.sh"
          idf.py --preset "${{ matrix.preset }}" build
