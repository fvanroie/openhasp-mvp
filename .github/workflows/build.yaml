name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        preset:
          - wt32-sc01-plus-8mb
          - wt32-sc01-plus-16mb

    runs-on: ubuntu-latest

    container:
      image: espressif/idf:v6.0.2

    steps:
      - uses: actions/checkout@v5
      
      - name: Show ccache configuration
        run: |
          echo "CCACHE_DIR=$CCACHE_DIR"
          ccache --show-config
          ccache --show-stats

      - name: Install project requirements
        run: |
          python -m pip install -r requirements.txt

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: /github/home/.cache/ccache
          key: ccache-${{ runner.os }}-${{ hashFiles('CMakePresets.json', '**/CMakeLists.txt', 'esp/sdkconfig.defaults') }}
          restore-keys: |
            ccache-${{ runner.os }}-

      # ESP-IDF run...

      - name: Board Manager
        run: idf.py bmgr -b "wt32_sc01_plus"

      - name: Build
        run: idf.py --preset "${{ matrix.preset }}" build
