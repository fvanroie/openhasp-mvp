name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        preset:
          - wt32-sc01-plus-8mb
          - wt32-sc01-plus-16mb

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # ESP-IDF setup...

      - uses: espressif/install-esp-idf-action@v1
        with:
          version: v6.0.2
          cache: true

      - name: Install project requirements
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          
      # ESP-IDF run...

      - name: Board Manager
        run: idf.py bmgr -b "wt32_sc01_plus"

      - name: Build
        run: idf.py --preset "${{ matrix.preset }}" build
