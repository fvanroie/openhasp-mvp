name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  presets:
    runs-on: ubuntu-latest

    outputs:
      matrix: ${{ steps.presets.outputs.matrix }}

    steps:
      - uses: actions/checkout@v5

      - name: Generate build matrix
        id: presets
        shell: bash
        run: |
          matrix="$(
            jq -c '
              [
                .configurePresets[]
                | {
                    preset: .name,
                    bsp_board: .environment.BSP_BOARD,
                    bsp_amend: (.environment.BSP_AMEND // "")
                  }
              ]
            ' CMakePresets.json
          )"

          echo "Build matrix:"
          echo "$matrix" | jq .

          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  build:
    needs: presets

    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.presets.outputs.matrix) }}

    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash

    container:
      image: espressif/idf:v6.0.2

    steps:
      - uses: actions/checkout@v5

      - name: Show ccache configuration
        run: |
          echo "CCACHE_DIR=$CCACHE_DIR"
          ccache --show-config
          ccache --show-stats

      - name: Inspect Python environment
        run: |
          echo "PATH=$PATH"
          echo "IDF_PATH=$IDF_PATH"
          which python
          python --version
          which pip || true
          find /opt/esp -maxdepth 4 -type f -name pip 2>/dev/null | head -20
          find /opt/esp -maxdepth 4 -type f -name python 2>/dev/null | head -20

      - name: Restore ccache
        uses: actions/cache@v5
        with:
          path: /github/home/.cache/ccache
          key: ccache-${{ runner.os }}-${{ hashFiles('CMakePresets.json', '**/CMakeLists.txt', 'esp/sdkconfig.defaults') }}
          restore-keys: |
            ccache-${{ runner.os }}-

      - name: Install project requirements
        run: |
          source "$IDF_PATH/export.sh"
          python -m pip install -r requirements.txt

      - name: Board Manager
        run: |
          source "$IDF_PATH/export.sh"

          args=(-b "${{ matrix.bsp_board }}")

          if [[ -n "${{ matrix.bsp_amend }}" ]]; then
            args+=(-a "${{ matrix.bsp_amend }}")
          fi

          echo "Running: idf.py bmgr ${args[*]}"

          idf.py bmgr "${args[@]}"

      - name: Build
        run: |
          source "$IDF_PATH/export.sh"
          idf.py --preset "${{ matrix.preset }}" build

      - name: Merge firmware
        run: |
          source "$IDF_PATH/export.sh"
          idf.py --preset "${{ matrix.preset }}" merge-bin \
            -o "openhasp-${{ matrix.preset }}.bin" \
            -f raw

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: openhasp-${{ matrix.preset }}
          path: openhasp-${{ matrix.preset }}.bin

